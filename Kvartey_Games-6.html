<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kvartey Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#0B0C0F;--surf:#14161B;--surf2:#1D2027;--ink:#F2EEE4;--mute:#8E8A80;--line:#2A2D35;--acc:#D4AF6A;--acc2:#7FB5A5;--onacc:#1A1406;--good:#6FCF97;--bad:#E5675B;--onc:#14100A;
--c1:#F58200;--c2:#0DB394;--c3:#EE3A5B;--c4:#2D78F0;--c5:#EDB100;--c6:#E5409A;--c7:#1FAE48;--c8:#07A3CC;--c9:#EE5A25;--c10:#74B825;
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
/* Yeşil */
:root[data-tema="zumrut"]{--bg:#0A3A2C;--surf:#115040;--surf2:#186752;--ink:#F1F7EE;--mute:#A9C9BA;--line:#2C7C64;--acc:#F2D16B;--acc2:#8EE6C0;--onacc:#1F1A05;--good:#7FE3A5;--bad:#FF8D80;--c1:#F5B94E;--c2:#5FE0C0;--c3:#FF8F7E;--c4:#8DB8FF;--c5:#E6E070;--c6:#FFA8BE;--c7:#B4EDA5;--c8:#F6F0DC;--c9:#F0A56E;--c10:#B6CCE0}
/* Mavi */
:root[data-tema="okyanus"]{--bg:#0B2A63;--surf:#133A83;--surf2:#1B4CA3;--ink:#EEF4FF;--mute:#A8BEE8;--line:#3066C4;--acc:#FFC857;--acc2:#7FD6FF;--onacc:#231800;--good:#6FE3A0;--bad:#FF8C80;--c1:#FFB74D;--c2:#4DD9C0;--c3:#FF7F75;--c4:#B0CCFF;--c5:#E8E26B;--c6:#FF9EC0;--c7:#8EE59A;--c8:#F4F0E4;--c9:#F29B6A;--c10:#C3D3EA}
/* Kırmızı */
:root[data-tema="kizil"]{--bg:#4A0F16;--surf:#66161F;--surf2:#842029;--ink:#FFF0EA;--mute:#E4ADA5;--line:#A63440;--acc:#FFC07A;--acc2:#FFE0A8;--onacc:#2A1004;--good:#86E0A0;--bad:#FFB0A4;--c1:#FFB347;--c2:#5FD3B8;--c3:#FFA18F;--c4:#9DBBF5;--c5:#E9DF73;--c6:#FFA6C1;--c7:#98DE92;--c8:#FAEFE4;--c9:#F0A065;--c10:#C1CFDE}
/* Beyaz */
:root[data-tema="beyaz"]{--bg:#F8F9FB;--surf:#FFFFFF;--surf2:#ECEFF4;--ink:#12161F;--mute:#667085;--line:#D9DEE7;--acc:#A56A00;--acc2:#1F7A6A;--onacc:#FFFFFF;--good:#2E8B57;--bad:#C0392B;--onc:#FFFFFF;--c1:#C77D1A;--c2:#2A8A78;--c3:#C4473A;--c4:#3F68B5;--c5:#8E8C12;--c6:#C4577A;--c7:#4A9A4A;--c8:#5C5A66;--c9:#A9602C;--c10:#5F7A94;color-scheme:light}
/* Fildişi */
:root[data-tema="fildisi"]{--bg:#F3EEE4;--surf:#FFFCF5;--surf2:#EAE3D3;--ink:#1E2430;--mute:#6B685F;--line:#D8CFBC;--acc:#9A6A10;--acc2:#2F6F62;--onacc:#FFF8E8;--good:#2E8B57;--bad:#C0392B;--onc:#FFFFFF;--c1:#C77D1A;--c2:#2A8A78;--c3:#C4473A;--c4:#3F68B5;--c5:#9C9A1E;--c6:#C4577A;--c7:#4A9A4A;--c8:#6B6254;--c9:#A9602C;--c10:#5F7A94;color-scheme:light}
:root[data-tema="gece"]{--bg:#070C1A;--surf:#0F1830;--surf2:#17234A;--ink:#EAF1FF;--mute:#8FA3CC;--line:#243662;--acc:#3DDCF2;--acc2:#4DA3FF;--onacc:#00212A;--good:#58E07B;--bad:#FF5470;--c1:#FF9F1C;--c2:#22D3B0;--c3:#FF5470;--c4:#4DA3FF;--c5:#FFD23F;--c6:#FF73B8;--c7:#58E07B;--c8:#3DDCF2;--c9:#FF7A45;--c10:#A6E85A}
:root[data-tema="grafit"]{--bg:#17181C;--surf:#202228;--surf2:#2B2E36;--ink:#F4F5F7;--mute:#9AA0AD;--line:#383C47;--acc:#FF9F1C;--acc2:#FFD23F;--onacc:#2A1600;--good:#58E07B;--bad:#FF5470;--c1:#FF9F1C;--c2:#22D3B0;--c3:#FF5470;--c4:#4DA3FF;--c5:#FFD23F;--c6:#FF73B8;--c7:#58E07B;--c8:#3DDCF2;--c9:#FF7A45;--c10:#A6E85A}
:root[data-tema="limon"]{--bg:#0A0D08;--surf:#141A10;--surf2:#1D2617;--ink:#F1F7E8;--mute:#9DAF8A;--line:#2C3A22;--acc:#A6E85A;--acc2:#3DDCF2;--onacc:#112000;--good:#58E07B;--bad:#FF5470;--c1:#FF9F1C;--c2:#22D3B0;--c3:#FF5470;--c4:#4DA3FF;--c5:#FFD23F;--c6:#FF73B8;--c7:#58E07B;--c8:#3DDCF2;--c9:#FF7A45;--c10:#A6E85A}
:root[data-tema="mercan"]{--bg:#160A0E;--surf:#22121A;--surf2:#301A24;--ink:#FFF0F3;--mute:#C79AA6;--line:#4A2634;--acc:#FF5470;--acc2:#FF9F1C;--onacc:#2A0710;--good:#58E07B;--bad:#FFB0A4;--c1:#FF9F1C;--c2:#22D3B0;--c3:#FF5470;--c4:#4DA3FF;--c5:#FFD23F;--c6:#FF73B8;--c7:#58E07B;--c8:#3DDCF2;--c9:#FF7A45;--c10:#A6E85A}
:root[data-tema="nane"]{--bg:#EEF8F4;--surf:#FFFFFF;--surf2:#DDF0E8;--ink:#0F2A22;--mute:#5B7D70;--line:#C6E3D8;--acc:#0B8F76;--acc2:#F58200;--onacc:#FFFFFF;--good:#1FAE48;--bad:#EE3A5B;--c1:#F58200;--c2:#0DB394;--c3:#EE3A5B;--c4:#2D78F0;--c5:#EDB100;--c6:#E5409A;--c7:#1FAE48;--c8:#07A3CC;--c9:#EE5A25;--c10:#74B825;--onc:#FFFFFF;color-scheme:light}
:root[data-tema="gokyuzu"]{--bg:#EAF3FF;--surf:#FFFFFF;--surf2:#D8E8FB;--ink:#0E1E3A;--mute:#5A7096;--line:#C3D7F3;--acc:#1F6FE0;--acc2:#F58200;--onacc:#FFFFFF;--good:#1FAE48;--bad:#EE3A5B;--c1:#F58200;--c2:#0DB394;--c3:#EE3A5B;--c4:#2D78F0;--c5:#EDB100;--c6:#E5409A;--c7:#1FAE48;--c8:#07A3CC;--c9:#EE5A25;--c10:#74B825;--onc:#FFFFFF;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--sans);padding-inline:16px;padding-block:0;overflow-x:hidden;background-image:radial-gradient(90% 50% at 50% -8%,color-mix(in srgb,var(--acc) 11%,transparent),transparent 70%);background-repeat:no-repeat;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{display:block}
#app{max-width:520px;margin-inline:auto;min-height:100%;position:relative}
.screen{min-height:100dvh;display:flex;flex-direction:column;padding-block:14px 22px;animation:fadeIn .35s ease both}
.screen[hidden]{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* açılış */
#splash{align-items:center;justify-content:center;text-align:center;gap:0;cursor:pointer}
#splash canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.emblem{width:112px;height:112px;color:var(--acc);filter:drop-shadow(0 0 22px color-mix(in srgb,var(--acc) 35%,transparent));animation:float 4s ease-in-out infinite;position:relative;z-index:1}
@keyframes float{50%{transform:translateY(-6px)}}
.logoP{width:200px;height:140px;border-radius:26px;background:#E5EBDF;display:grid;place-items:center;overflow:hidden;position:relative;z-index:1;box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent),0 18px 50px rgba(0,0,0,.35);animation:float 4s ease-in-out infinite}
.logoP img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;display:block}
.mkp{position:relative;flex:none;width:52px;height:36px;border-radius:10px;background:#E5EBDF;overflow:hidden;display:grid;place-items:center;box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent)}
.mkp img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;display:block}
.brand{font:700 clamp(34px,10vw,52px)/1 var(--serif);letter-spacing:.22em;margin:22px 0 0 .22em;position:relative;z-index:1;background:linear-gradient(100deg,var(--ink) 30%,var(--acc) 48%,var(--ink) 66%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.rule{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--acc);position:relative;z-index:1}
.rule i{display:block;width:62px;height:1px;background:linear-gradient(90deg,transparent,var(--acc))}
.rule i:last-child{transform:scaleX(-1)}
.sub2{font:600 13px/1 var(--sans);letter-spacing:.7em;margin-left:.7em;color:var(--acc);position:relative;z-index:1}
.tapto{margin-top:54px;font-size:13px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;animation:blink 1.6s ease-in-out infinite;position:relative;z-index:1}
@keyframes blink{50%{opacity:.25}}
/* ana ekran */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top .mk{width:34px;height:34px;color:var(--acc)}
.top .wm{flex:1;min-width:0;font:700 22px/1 var(--serif);letter-spacing:.16em;white-space:nowrap}
.top .wm small{display:block;font:700 9px/1 var(--sans);letter-spacing:.5em;color:var(--acc);margin-top:5px}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;color:var(--ink);transition:transform .15s,border-color .15s}
.ib:active{transform:scale(.92)}.ib:hover{border-color:var(--acc)}
.ib svg{width:20px;height:20px}
.prof{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;margin-bottom:18px;position:relative;overflow:hidden}
.prof::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.prof .lv{font:700 26px/1 var(--serif);letter-spacing:.04em}.prof .lv small{font:600 11px var(--sans);letter-spacing:.18em;color:var(--mute);margin-right:6px;text-transform:uppercase}
.streak{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--acc)}.streak svg{width:20px;height:20px}
.xpbar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--surf2);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:6px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xpt{grid-column:1/-1;font-size:12px;color:var(--mute);margin-top:-2px}
.sec{font:700 11px/1 var(--sans);letter-spacing:.24em;color:var(--mute);text-transform:uppercase;margin:6px 2px 10px}
.resume{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 18%,var(--surf)),var(--surf));border:1px solid color-mix(in srgb,var(--acc) 50%,var(--line));border-radius:16px;padding:14px 16px;margin-bottom:18px}
.resume .ri{width:44px;height:44px;border-radius:12px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none}.resume .ri svg{width:24px;height:24px}
.resume b{display:block;font:700 18px/1.1 var(--serif);letter-spacing:.04em}.resume span{font-size:13px;color:var(--mute)}
.resume .go{margin-left:auto;font:800 12px var(--sans);letter-spacing:.14em;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow:hidden;transition:transform .18s,border-color .18s;animation:fadeIn .5s ease both}
.card:hover{border-color:var(--acc)}.card:active{transform:scale(.97)}
.card .gi{width:46px;height:46px;border-radius:13px;border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));color:var(--acc);display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 8%,transparent)}
.card .gi svg{width:26px;height:26px}
.card b{font:700 20px/1.1 var(--serif);letter-spacing:.03em;margin-top:6px}
.card p{margin:0;font-size:12.5px;color:var(--mute);line-height:1.35}
.card .bs{margin-top:auto;padding-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.card .bs em{font-style:normal;color:var(--acc);font-size:14px;letter-spacing:.04em;margin-left:4px}
.card .chip{position:absolute;top:12px;right:12px;font:800 9px/1 var(--sans);letter-spacing:.14em;color:var(--onacc);background:var(--acc);border-radius:6px;padding:4px 6px}
.card.lock{opacity:.5;cursor:default}.card.lock:hover{border-color:var(--line)}.card.lock:active{transform:none}
.foot{margin-top:22px;text-align:center;color:var(--mute);font-size:12px;letter-spacing:.2em}
/* oyun kabuğu */
.gbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gbar .gt{flex:1;min-width:0;text-align:center}
.gbar .gt b{display:block;font:700 19px/1 var(--serif);letter-spacing:.14em;text-transform:uppercase}
.gbar .gt span{display:block;margin-top:5px;font:700 10px/1 var(--sans);letter-spacing:.2em;color:var(--mute)}
.gbar .gt span em{font-style:normal;color:var(--acc)}
.gsc{text-align:center;margin:0 0 10px;font:700 44px/1 var(--serif);font-variant-numeric:tabular-nums;color:var(--ink);transition:transform .15s}
.gsc.pop{transform:scale(1.14);color:var(--acc)}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;position:relative}
.hint{color:var(--mute);font-size:12.5px;margin:12px 0 0;text-align:center}
.over{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fadeIn .3s ease both}
.over[hidden]{display:none}
.ov{width:min(100%,380px);background:var(--surf);border:1px solid color-mix(in srgb,var(--acc) 50%,var(--line));border-radius:22px;padding:26px 22px 22px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45);animation:rise .45s cubic-bezier(.2,1.2,.3,1) both}
@keyframes rise{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.ov .em2{width:54px;height:54px;margin:0 auto 10px;color:var(--acc)}
.ov h2{font:700 30px/1.05 var(--serif);letter-spacing:.06em;margin:0 0 6px}
.ov p{margin:0 0 4px;color:var(--mute)}
.ov .big{font:700 52px/1.1 var(--serif);color:var(--acc);margin:6px 0 2px}
.ov .btns{display:grid;gap:10px;margin-top:18px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:13px;border:1px solid var(--line);background:var(--surf2);font-weight:800;letter-spacing:.06em;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.sm{padding:10px 14px;font-size:13px}
/* ayarlar */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);animation:fadeIn .2s ease both}
.sheet[hidden]{display:none}
.sp{width:min(100%,520px);max-height:88dvh;overflow:auto;background:var(--surf);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:slideUp .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sp h3{font:700 26px/1 var(--serif);letter-spacing:.08em;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.sp h4{font:700 11px/1 var(--sans);letter-spacing:.22em;color:var(--mute);text-transform:uppercase;margin:18px 0 10px}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.th{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mute);font-weight:700}
.th i{display:block;width:100%;aspect-ratio:1.55;border-radius:14px;border:2px solid var(--line);position:relative;overflow:hidden}
.th i u{position:absolute;left:10%;right:10%;bottom:14%;height:38%;border-radius:7px;background:var(--sw3)}
.th i::after{content:"";position:absolute;left:14%;top:16%;width:20%;aspect-ratio:1;border-radius:50%;background:var(--sw2)}
.th.on{color:var(--ink)}.th.on i{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tg:first-of-type{border-top:0}
.tg span small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.sw{width:50px;height:30px;border-radius:30px;background:var(--surf2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:color-mix(in srgb,var(--acc) 30%,var(--surf2));border-color:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--acc)}
.seg{display:flex;gap:6px}.seg button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-80px);z-index:60;background:var(--surf2);border:1px solid color-mix(in srgb,var(--acc) 55%,var(--line));color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.05em;transition:transform .35s cubic-bezier(.2,1.2,.3,1);pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.ft{position:fixed;z-index:55;pointer-events:none;font:800 20px/1 var(--sans);color:var(--acc);text-shadow:0 2px 10px rgba(0,0,0,.4);animation:floatUp 1s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes floatUp{to{transform:translate(-50%,-150%) scale(1.15);opacity:0}}
.shake{animation:shk .36s ease}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
/* 2048 */
.b2048{width:100%;max-width:440px}
.b-board{position:relative;width:100%;aspect-ratio:1;background:var(--surf);border:1px solid var(--line);border-radius:18px;container-type:inline-size;touch-action:none;padding:2.4%}
.b-cells,.b-tiles{position:absolute;inset:2.4%}
.b-cells{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.b-cells i{margin:3%;border-radius:10px;background:var(--surf2);opacity:.7}
.tile{position:absolute;width:25%;height:25%;transition:left .12s ease-out,top .12s ease-out}
.tile b{position:absolute;inset:3%;border-radius:10px;display:grid;place-items:center;font:800 9.5cqw/1 var(--sans);color:var(--onc);background:var(--surf2);box-shadow:0 2px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18)}
.tile.new b{animation:appear .2s ease-out}.tile.pop b{animation:popit .2s ease-out}
@keyframes appear{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes popit{50%{transform:scale(1.18)}}
.tile b[data-l="4"]{font-size:7.6cqw}.tile b[data-l="5"]{font-size:6.2cqw}
.v1 b,.v2 b{color:#2A1A00}
.v1 b{background-color:#FFE9B0}.v2 b{background-color:#FFBF4D}
.v3 b{background:var(--c1)}.v4 b{background:var(--c2)}.v5 b{background:var(--c3)}.v6 b{background:var(--c4)}.v7 b{background:var(--c5)}.v8 b{background:var(--c6)}.v9 b{background:var(--c7)}.v10 b{background:var(--c8)}
.v11 b{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 22px color-mix(in srgb,var(--acc) 70%,transparent)}
/* hafıza */
.mem{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.mstat{display:flex;gap:18px;font:700 11px var(--sans);letter-spacing:.18em;color:var(--mute);text-transform:uppercase}.mstat em{font-style:normal;color:var(--ink);font-size:14px;margin-left:4px}
.mgrid{display:grid;gap:8px;width:100%;max-width:440px}
.mc{perspective:600px;aspect-ratio:1/1.12;cursor:pointer}
.mc>div{position:relative;width:100%;height:100%;transition:transform .38s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.mc.f>div{transform:rotateY(180deg)}
.mc .fa,.mc .bk{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.mc .bk{background:var(--surf2);border:1px solid var(--line);background-image:repeating-linear-gradient(45deg,transparent 0 7px,color-mix(in srgb,var(--acc) 22%,transparent) 7px 8px),repeating-linear-gradient(-45deg,transparent 0 7px,color-mix(in srgb,var(--acc) 22%,transparent) 7px 8px)}
.mc .bk::after{content:"";position:absolute;inset:5px;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);border-radius:8px}
.mc .fa{background:var(--surf);border:1px solid var(--line);transform:rotateY(180deg)}
.mc .fa svg{width:62%;height:62%}
.mc.m .fa{border-color:var(--acc);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 40%,transparent)}
.mc.m{animation:mpop .4s ease}
@keyframes mpop{50%{transform:scale(1.08)}}
/* blok */
.blk{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.bboard{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:100%;aspect-ratio:1;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:6px;touch-action:none;position:relative}
.bc{border-radius:6px;background:var(--surf2);opacity:.85;transition:transform .12s,opacity .12s}
.bc.k{opacity:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.2)}
.k1{background:var(--c1)}.k2{background:var(--c2)}.k3{background:var(--c3)}.k4{background:var(--c4)}.k5{background:var(--c5)}.k6{background:var(--c6)}.k7{background:var(--c7)}.k8{background:var(--c8)}
.bc.gh{opacity:.55;transform:scale(.94)}
.bc.clr{animation:clr .3s ease forwards}
@keyframes clr{40%{transform:scale(1.2);filter:brightness(1.8)}100%{transform:scale(0);opacity:0}}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{height:calc(var(--mc,20px)*5 + 20px);border:1px dashed var(--line);border-radius:14px;display:grid;place-items:center;touch-action:none;cursor:grab}
.pc{display:grid;gap:2px}
.pc i{display:block;border-radius:4px}
.pc i.e{background:transparent}
.slot .pc{transition:transform .15s}
.slot.drag .pc{opacity:.2}
.dragpc{position:fixed;z-index:45;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.dragpc i{box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
/* renk sıralama */
.sort{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
.tubes{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:22px 16px;width:100%;padding-top:22px}
.tube{width:46px;height:166px;position:relative;cursor:pointer;color:color-mix(in srgb,var(--ink) 58%,var(--line));transition:transform .18s cubic-bezier(.3,1.4,.5,1),filter .3s}
.tube svg{display:block;pointer-events:none}
.tube.sel{transform:translateY(-16px)}
.tube.done{color:var(--acc);filter:drop-shadow(0 0 9px color-mix(in srgb,var(--acc) 55%,transparent))}
.wave{animation:wv 1.7s linear infinite}
@keyframes wv{to{transform:translateX(-40px)}}
.tube.ad{display:flex;border-radius:6px 6px 24px 24px;border:2px dashed color-mix(in srgb,var(--acc) 75%,transparent);border-top-color:transparent;align-items:center;justify-content:center;gap:5px;padding:4px 2px;background:color-mix(in srgb,var(--acc) 7%,transparent);color:var(--acc);text-align:center;flex-direction:column}
.tube.ad svg{width:24px;height:24px}
.tube.ad b{font:800 8.5px/1.15 var(--sans);letter-spacing:.08em}
.tube.ad em{font:800 12px/1 var(--sans);font-style:normal;color:var(--ink);opacity:.85}
/* oda toplama */
.room{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.rzones{display:grid;gap:8px}
.rz{position:relative;border:2px solid color-mix(in srgb,var(--zc) 55%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--zc) 9%,var(--surf));color:var(--zc);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;min-width:0;cursor:pointer;transition:transform .15s,box-shadow .25s,background .25s}
.rz svg{width:34px;height:34px}
.rz b{font:700 11px/1.1 var(--sans);letter-spacing:.04em;color:var(--ink);text-align:center}
.rz span{font:800 11px/1 var(--sans);color:var(--mute)}
.rz.hot{transform:scale(1.06);background:color-mix(in srgb,var(--zc) 22%,var(--surf));box-shadow:0 0 18px color-mix(in srgb,var(--zc) 55%,transparent)}
.rz.pulse{animation:mpop .35s ease}
.rz.done{border-style:solid;border-color:var(--zc);box-shadow:0 0 16px color-mix(in srgb,var(--zc) 45%,transparent)}
.rz.done span{color:var(--zc)}
.rfloor{position:relative;width:100%;aspect-ratio:1/1.08;border:1px solid var(--line);border-radius:18px;background:var(--surf2);background-image:repeating-linear-gradient(90deg,transparent 0 56px,color-mix(in srgb,var(--ink) 7%,transparent) 56px 57px);touch-action:none}
.ri2{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--surf);border:1px solid var(--line);box-shadow:0 5px 12px rgba(0,0,0,.28);display:grid;place-items:center;font-size:29px;line-height:1;cursor:grab;touch-action:none;transition:left .28s cubic-bezier(.3,1.3,.5,1),top .28s cubic-bezier(.3,1.3,.5,1),transform .25s,opacity .25s;font-family:system-ui,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ri2.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 40%,transparent),0 8px 16px rgba(0,0,0,.35);transform:scale(1.14) rotate(0)!important}
.ri2.drag{transition:none;z-index:20;transform:scale(1.28) rotate(0)!important;box-shadow:0 14px 26px rgba(0,0,0,.45);cursor:grabbing}
.ri2.in{transform:scale(.15)!important;opacity:0}
.ri2.bad{animation:shk .36s ease}
.row2{display:flex;gap:10px;width:100%;max-width:440px}
.row2 .btn{flex:1}
/* kelime */
.wd{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px}
.wgrid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:min(100%,300px)}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wt{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font:800 26px/1 var(--sans);text-transform:uppercase;transition:transform .5s,background .25s,border-color .25s,color .25s}
.wt.fill{border-color:var(--mute);animation:popit .12s}
.wt.r{transform:rotateX(360deg);color:#fff;border-color:transparent}
.wt.ok{background:var(--good)}.wt.pr{background:#F08A24}.wt.no{background:var(--surf2);color:var(--mute)}
.kb{display:flex;flex-direction:column;gap:6px;width:100%}
.kr{display:flex;gap:4px;justify-content:center}
.kk{flex:1;min-width:0;height:48px;border-radius:8px;background:var(--surf2);font:800 15px var(--sans);display:grid;place-items:center;transition:background .2s,transform .1s;border:1px solid var(--line)}
.kk:active{transform:scale(.92)}
.kk.w{flex:1.7;font-size:11px;letter-spacing:.04em}
.kk.ok{background:var(--good);color:#fff;border-color:transparent}.kk.pr{background:#F08A24;color:#fff;border-color:transparent}.kk.no{opacity:.35}
/* kule */
.stk{width:100%;max-width:420px}
.stk canvas{width:100%;display:block;border-radius:18px;border:1px solid var(--line);touch-action:none;cursor:pointer;background:var(--surf)}
/* match-3 */
.m3{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:10px}
.m3b{position:relative;width:100%;aspect-ratio:1;border-radius:18px;border:1px solid var(--line);background-color:var(--surf);background-image:conic-gradient(var(--surf2) 25%,transparent 0 50%,var(--surf2) 0 75%,transparent 0);background-size:25% 25%;touch-action:none;overflow:hidden}
.gm{position:absolute;width:12.5%;height:12.5%;padding:1.2%;transition:left .2s ease,top .2s ease,transform .2s,opacity .2s}
.gm svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));pointer-events:none}
.gm.sel{transform:scale(1.14);z-index:2}.gm.pop2{animation:pop2 .4s ease}@keyframes pop2{40%{transform:scale(1.35)}}
.gm.clr{transform:scale(0);opacity:0}
.gm.hint{animation:hintp .7s ease-in-out infinite}
@keyframes hintp{50%{transform:scale(1.18)}}
.gm.sp svg{filter:drop-shadow(0 0 7px var(--acc))}
.gm.fall{transition:top .32s cubic-bezier(.4,1.35,.6,1)}
.m3t{width:100%;height:6px;border-radius:6px;background:var(--surf2);overflow:hidden}.m3t i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}
@media (max-width:380px){.grid{gap:8px}.card{padding:12px 11px}.card b{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ===== v7: canlı palet, ana ekran, oyun cilası ===== */
body{background-image:radial-gradient(80% 36% at 8% -6%,color-mix(in srgb,var(--c4) 17%,transparent),transparent 70%),radial-gradient(70% 34% at 100% 0%,color-mix(in srgb,var(--c3) 13%,transparent),transparent 70%),radial-gradient(90% 40% at 50% 108%,color-mix(in srgb,var(--c2) 10%,transparent),transparent 70%)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip2{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font:700 13px var(--sans);color:var(--mute);transition:transform .15s,background .2s}
.chip2:active{transform:scale(.95)}
.chip2.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);box-shadow:0 8px 20px -8px var(--acc)}
.feat{position:relative;overflow:hidden;width:100%;text-align:left;display:flex;align-items:center;gap:8px;border-radius:16px;padding:10px 14px;margin-bottom:10px;color:var(--onc);background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 92%,#fff),color-mix(in srgb,var(--gc) 72%,#000));box-shadow:0 18px 40px -18px var(--gc);animation:fadeIn .5s ease both}
.feat::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.38),transparent 55%),repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.06) 14px 16px);pointer-events:none}
.feat:active{transform:scale(.985)}
.feat .fl{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.feat .fk{font:800 10px/1 var(--sans);letter-spacing:.22em;opacity:.8}
.feat b{font:700 20px/1 var(--serif);letter-spacing:.03em}
.feat p{display:none}
.feat .fgo{align-self:flex-start;margin-top:4px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--onc);color:var(--gc);font:800 10px var(--sans);letter-spacing:.14em;box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.feat .fgo svg{width:11px;height:11px}
.feat .fi{position:relative;flex:none;width:48px;height:48px;color:var(--onc);opacity:.92;transform:rotate(-8deg);filter:drop-shadow(0 8px 12px rgba(0,0,0,.25));animation:float 3.6s ease-in-out infinite}
.feat .fi svg{width:100%;height:100%}
.mis{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:16px;background:var(--surf)}
.mis .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mis .mt b{font:700 19px/1 var(--serif);letter-spacing:.04em}
.mis .mt span{font-size:12.5px;color:var(--mute)}
.dots{display:flex;gap:8px;margin-top:3px}
.dots i{width:14px;height:14px;border-radius:4px;transform:rotate(45deg);border:2px solid var(--line);transition:all .3s}
.dots i.on{background:var(--c5);border-color:var(--c5);box-shadow:0 0 12px var(--c5)}
.mis .done{font:800 12px var(--sans);letter-spacing:.12em;color:var(--good)}
.claim{padding:11px 16px;border-radius:12px;background:var(--c5);color:#2a1d00;font:800 12px var(--sans);letter-spacing:.1em;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.card{--gc:var(--acc);background:linear-gradient(158deg,color-mix(in srgb,var(--gc) 24%,var(--surf)),var(--surf) 64%);border-color:color-mix(in srgb,var(--gc) 38%,var(--line));padding:14px 14px 14px}
.card:hover{border-color:var(--gc)}
.card .cdeco{position:absolute;right:-16px;bottom:-18px;width:104px;height:104px;color:var(--gc);opacity:.13;transform:rotate(-14deg);pointer-events:none}
.card .cdeco svg{width:100%;height:100%}
.card .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.card .gi{background:linear-gradient(145deg,color-mix(in srgb,var(--gc) 88%,#fff),var(--gc));color:var(--onc);border:0;box-shadow:0 10px 20px -10px var(--gc)}
.card .ctag{font:800 9px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gc);border:1px solid color-mix(in srgb,var(--gc) 55%,transparent);border-radius:999px;padding:5px 8px;background:color-mix(in srgb,var(--gc) 10%,transparent)}
.card b{margin-top:8px}
.card .bs{display:flex;align-items:center;justify-content:space-between;position:relative}
.card .bs em{color:var(--ink)}
.card .play{width:34px;height:34px;border-radius:50%;background:var(--gc);color:var(--onc);display:grid;place-items:center;box-shadow:0 8px 16px -8px var(--gc)}
.card .play svg{width:11px;height:11px;margin-left:2px}
.card .dv{position:absolute;top:10px;left:10px;width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 30%,transparent);animation:pulse 1.6s ease-in-out infinite}
.card.lock{opacity:.6;border-style:dashed;background:var(--surf)}
.card.lock .gi{background:var(--surf2);color:var(--mute);box-shadow:none}
.resume .ri{background:linear-gradient(145deg,var(--c1),var(--c9));color:var(--onc)}
/* oyun içi cila */
.tile b{background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 52%,rgba(0,0,0,.16))}
.bc.k,.pc i:not(.e){background-image:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%,rgba(0,0,0,.2))}
.bc{border-radius:7px}
.mc .bk{background:linear-gradient(150deg,var(--c4),var(--c2));border:0;box-shadow:0 8px 16px -8px var(--c4),inset 0 1px 0 rgba(255,255,255,.4);overflow:hidden}
.mc .bk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.28) 1.6px,transparent 2.2px);background-size:15px 15px}
.mc .bk::after{inset:6px;border:2px solid rgba(255,255,255,.4);border-radius:9px}
.mc{container-type:inline-size}
.mc .fa{border:0;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c5) 24%,var(--surf)),var(--surf));box-shadow:0 8px 16px -10px rgba(0,0,0,.5),inset 0 0 0 1px var(--line)}
.mc .fa .em{font-size:52cqw;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.mc.m .fa{box-shadow:0 0 0 2px var(--good),0 0 18px color-mix(in srgb,var(--good) 55%,transparent)}
.dstart{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#fff;z-index:2;background:transparent}
.dstart[hidden]{display:none}
.dstart b{font:700 30px/1 var(--serif);letter-spacing:.1em;padding:16px 26px;border-radius:999px;background:var(--acc);color:var(--onacc);box-shadow:0 14px 34px -10px var(--acc);animation:pulse 1.3s ease-in-out infinite}
.dstart span{font-size:13px;color:#fff;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.krow{display:flex;gap:8px;width:100%;justify-content:center}.krow .btn{flex:1;min-width:0;white-space:nowrap;text-align:center}
.dstart b{font-size:22px;padding:14px 22px;max-width:86%;text-align:center}

.embw{position:relative;z-index:1;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 26px color-mix(in srgb,var(--acc) 32%,transparent))}
.emb{width:212px;height:212px;display:block}
.emb .rays{transform-origin:100px 100px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.emb .bolt{animation:zap 3.6s ease-in-out infinite;transform-origin:100px 100px}
@keyframes zap{0%,82%,100%{filter:none;transform:none}86%{filter:drop-shadow(0 0 10px var(--acc)) brightness(1.5);transform:scale(1.06)}90%{filter:none;transform:none}93%{filter:drop-shadow(0 0 12px var(--acc)) brightness(1.6)}}
.mkp{position:relative;flex:none;width:42px;height:42px;color:var(--acc);background:none;box-shadow:none;border-radius:0;overflow:visible;display:block}
.mkp svg{width:100%;height:100%}
.tube{will-change:transform}
/* yeni giriş logosu */
.logoFull{position:relative;z-index:1;width:min(78vw,340px);aspect-ratio:1;border-radius:34px;overflow:hidden;background:#F3ECE2;box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent),0 24px 70px rgba(0,0,0,.45);animation:float 4s ease-in-out infinite}
.logoFull img{display:block;width:100%;height:100%;max-width:none;object-fit:cover}
#splash .tapto{margin-top:36px}
/* araba bulmacası */
.carw{width:100%;max-width:430px}
.carw canvas{width:100%;display:block;border-radius:18px;border:1px solid var(--line);touch-action:none;background:var(--surf);cursor:grab}
.cinfo{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px;font:700 12px/1 var(--sans);letter-spacing:.14em;color:var(--mute)}
.cinfo b{font:700 22px/1 var(--serif);letter-spacing:.02em;color:var(--ink);margin-left:4px}
.cinfo small{font:600 11px var(--sans);letter-spacing:.06em;color:var(--acc);margin-left:4px}
.cbar{display:flex;gap:10px;margin-top:12px}
.cbtn{flex:1;padding:12px 8px;border-radius:14px;background:var(--surf);border:1px solid var(--line);font:700 13px var(--sans);letter-spacing:.04em;transition:transform .12s,border-color .2s}
.cbtn:active{transform:scale(.96);border-color:var(--acc)}
.gbar{gap:8px}
.help p{margin:0 0 10px;color:var(--mute);font-size:14px;line-height:1.5}
.help .hl{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px}.help .hl i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font:800 13px/1 var(--sans);font-style:normal}
.help .hl span{font-size:14.5px;line-height:1.45}
.gift{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 12px;padding:14px 16px;border-radius:20px;border:1px solid color-mix(in srgb,var(--c5) 55%,transparent);background:linear-gradient(120deg,color-mix(in srgb,var(--c5) 22%,var(--surf)),var(--surf));color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.gift .gx{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--c5);color:#2A1A00;animation:giftb 1.8s ease-in-out infinite}
.gift .gx svg{width:26px;height:26px}

<script>
/* ================= KVARTEY GAMES — çekirdek ================= */
const $=(s,r=document)=>r.querySelector(s);
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ds(new Date());
const KEY='kvartey_games_v1';
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
const DB=Object.assign({tema:'obsidyen',sound:true,vib:true,fx:'tam',xp:0,streak:0,last:'',lastGame:'',best:{},saves:{},daily:{d:'',p:[],c:false},seen:{},mod:'modern'},loadDB());
if(!DB.daily)DB.daily={d:'',p:[],c:false};if(!DB.seen)DB.seen={};if(!DB.balls)DB.balls={};if(!DB.ball)DB.ball='klasik';
let _pt=0;
function flush(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function persist(){clearTimeout(_pt);_pt=setTimeout(flush,120)}
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

/* ---- ses (WebAudio ile üretilir, dosya yok) ---- */
let AC=null,MASTER=null;
function audio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.55;MASTER.connect(AC.destination)}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d=.12,type='sine',v=.2,slide=0,delay=0){
  if(!DB.sound)return;const a=audio();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+d+.03);
}
const N=s=>440*Math.pow(2,s/12);
const SFX={
  click:()=>tone(660,.05,'triangle',.14),
  tap:()=>tone(540,.07,'triangle',.2),
  flip:()=>tone(360,.09,'sine',.22,1.6),
  match:()=>[0,4,7].forEach((s,i)=>tone(N(s+3),.2,'sine',.22,0,i*.07)),
  nomatch:()=>tone(210,.2,'sawtooth',.09,.6),
  move:()=>tone(230,.05,'triangle',.1),
  merge:(k=0)=>{tone(N(k*2-8),.14,'triangle',.22);tone(N(k*2+4),.22,'sine',.13,0,.04)},
  place:()=>{tone(300,.09,'square',.1,.7);tone(180,.12,'sine',.18,.6)},
  clear:(n=1)=>{for(let i=0;i<Math.min(n+3,7);i++)tone(N(i*2+2),.16,'sine',.22,0,i*.055)},
  combo:(n=2)=>{for(let i=0;i<3;i++)tone(N(5+n*2+i*4),.18,'triangle',.18,0,.08+i*.06)},
  pour:()=>tone(720,.18,'sine',.16,.45),
  wrong:()=>{tone(160,.14,'square',.09,.7)},
  win:()=>[0,4,7,12,16,19].forEach((s,i)=>tone(N(s),.3,'triangle',.22,0,i*.09)),
  lose:()=>[0,-3,-7].forEach((s,i)=>tone(N(s-5),.34,'sawtooth',.1,.85,i*.15)),
  levelup:()=>[0,7,12,19].forEach((s,i)=>tone(N(s+3),.3,'sine',.25,0,i*.1)),
  perfect:(n=1)=>{for(let i=0;i<2+Math.min(n,4);i++)tone(N(8+i*3+n),.18,'triangle',.2,0,i*.05)},
  drop:()=>tone(140,.12,'sine',.34,.5),
  key:()=>tone(440,.04,'triangle',.12),
  rv:(i=0,t=0)=>tone(N(t===2?10+i:t===1?4+i:-4+i),.16,'triangle',.18)
};

const fxc=$('#fx'),fxx=fxc.getContext('2d');
let parts=[],fxLoop=0,DPR=1;
function fitFx(){DPR=1;fxc.width=innerWidth*DPR;fxc.height=innerHeight*DPR}
addEventListener('resize',fitFx);fitFx();
function pal(){const cs=getComputedStyle(document.documentElement);const a=[];for(let i=1;i<=8;i++)a.push(cs.getPropertyValue('--c'+i).trim());a.push(cs.getPropertyValue('--acc').trim());return a}
function confetti(x,y,n=40,spread=1){
  if(DB.fx==='az')n=Math.round(n/3);n=Math.min(Math.round(n*.45),26);if(n<1)return;
  if(parts.length>90)return;
  const cols=pal();
  parts.push({ring:1,x,y,rad:6,life:20,max:20,c:cols[0],w:3*Math.min(1.6,.6+n/60)});
  
  for(let i=0;i<n;i++){const an=Math.random()*6.2832,sp=(2+Math.random()*9)*spread;
    parts.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-1.2,g:.16,s:1.6+Math.random()*2.6,c:cols[rnd(cols.length)],life:34+rnd(34),max:68,tw:Math.random()*6})}
  if(!fxLoop)fxLoop=requestAnimationFrame(fxTick);
}
function fxTick(){
  fxx.setTransform(DPR,0,0,DPR,0,0);fxx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  fxx.lineCap='round';
  for(const p of parts){
    if(p.ring){if(p.delay&&p.delay-->0)continue;p.life--;p.rad+=(p.max-p.life)*.55+2;const k=p.life/p.max;fxx.globalAlpha=k*.8;fxx.strokeStyle=p.c;fxx.lineWidth=p.w*k+.5;fxx.beginPath();fxx.arc(p.x,p.y,p.rad,0,7);fxx.stroke();continue}
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.97;p.life--;
    const k=Math.max(0,p.life/p.max),tw=.65+.35*Math.sin(p.tw+p.life*.5);
    fxx.globalAlpha=Math.min(1,k*1.6)*tw;fxx.strokeStyle=p.c;fxx.lineWidth=p.s*(.5+k);
    fxx.beginPath();fxx.moveTo(p.x,p.y);fxx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2);fxx.stroke();
  }
  fxx.globalAlpha=1;
  fxLoop=parts.length?requestAnimationFrame(fxTick):0;
  if(!fxLoop)fxx.clearRect(0,0,innerWidth,innerHeight);
}
function floatText(x,y,txt,color){
  if(DB.fx==='az'&&txt.length<3)return;
  const f=E('div','ft',txt);f.style.left=x+'px';f.style.top=y+'px';if(color)f.style.color=color;
  document.body.appendChild(f);setTimeout(()=>f.remove(),1050);
}

const lvlOf=xp=>Math.floor(Math.sqrt(xp/40))+1;

  n=Math.round(n);if(n<=0)return;touchStreak();

const TEST_HILE=true;let adTaps=0,adTapT=0;

  if(!TEST_HILE){toast('Reklam özelliği yakında');return}

function drawRunner(c,id,x,y,s,t,pose,crouch){
  // x,y = ayak ortası. pose: 0 koş/dur, 1 havada (bacaklar toplu), 2 çömel (crouch 0..1)
  const col=SKINS.run.list.find(q=>q.id===id).c,k=crouch||0;
  const run=pose===0?Math.sin(t*14):0;
  c.save();c.translate(x,y);c.scale(s,s);
  const hip=pose===2?-14+k*8:pose===1?-22:-14;       // kalça yüksekliği
  const leg=id==='ninja'?'#111':'#2a2d36';
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(0,2,16,5,0,0,7);c.fill();
  c.strokeStyle=leg;c.lineWidth=7;c.lineCap='round';c.lineJoin='round';
  const L=(sx,kx,ky,fx,fy)=>{c.beginPath();c.moveTo(sx,hip);c.lineTo(kx,ky);c.lineTo(fx,fy);c.stroke()};
  if(pose===2){const b=k;L(-5,-13-4*b,hip+8,-8,0);L(5,13+4*b,hip+8,8,0)}               // diz bükük, ayaklar yerde
  else if(pose===1){L(-5,-12,hip+7,-7,hip+16);L(5,14,hip+4,12,hip+14)}                      // havada toplanmış
  else{L(-5,-5+run*4,-8,-7+run*8,0);L(5,5-run*4,-8,7-run*8,0)}
  // gövde (ölçeklenmeden, sadece kalçaya göre taşınır)
  const top=hip-32;
  c.fillStyle=col;c.beginPath();c.roundRect?c.roundRect(-13,top,26,32,10):c.rect(-13,top,26,32);c.fill();
  c.fillStyle='rgba(255,255,255,.25)';c.fillRect(-8,top+4,16,5);
  // kollar
  c.strokeStyle=col;c.lineWidth=6;c.beginPath();
  if(pose===2){c.moveTo(-11,top+8);c.lineTo(-22,top+20);c.moveTo(11,top+8);c.lineTo(-2,top+22)}
  else if(pose===1){c.moveTo(-11,top+6);c.lineTo(-20,top-6);c.moveTo(11,top+6);c.lineTo(20,top-6)}
  else{c.moveTo(-11,top+8);c.lineTo(-17,top+18+run*4);c.moveTo(11,top+8);c.lineTo(17,top+18-run*4)}
  c.stroke();
  // kafa
  const hy=top-12;
  if(id==='tilki'){c.fillStyle='#FF9F1C';c.beginPath();c.moveTo(-12,hy-2);c.lineTo(-6,hy-18);c.lineTo(0,hy-4);c.moveTo(12,hy-2);c.lineTo(6,hy-18);c.lineTo(0,hy-4);c.fill()}
  if(id==='kedi'){c.fillStyle=col;c.beginPath();c.moveTo(-13,hy-2);c.lineTo(-8,hy-18);c.lineTo(-2,hy-4);c.moveTo(13,hy-2);c.lineTo(8,hy-18);c.lineTo(2,hy-4);c.fill()}
  c.fillStyle=id==='robot'?'#9CC4FF':id==='astro'?'#F4F5F7':id==='ninja'?'#1b1d24':id==='kurba'?'#58E07B':col;
  c.beginPath();c.arc(0,hy,15,0,7);c.fill();
  if(id==='tilki'){c.fillStyle='#fff';c.beginPath();c.ellipse(0,hy+8,8,6,0,0,7);c.fill()}
  if(id==='robot'){c.fillStyle='#2D78F0';c.fillRect(-2,hy-24,4,9);c.beginPath();c.arc(0,hy-26,3,0,7);c.fill()}
  if(id==='astro'){c.fillStyle='#3a4a6b';c.beginPath();c.arc(0,hy,11,0,7);c.fill();c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(-4,hy-4,3.5,0,7);c.fill()}
  else if(id==='ninja'){c.fillStyle='#F0C9A5';c.fillRect(-11,hy-4,22,7);c.fillStyle='#E5405A';c.fillRect(-15,hy-9,30,4)}
  else{c.fillStyle='#fff';c.beginPath();c.arc(-6,hy-1,4.5,0,7);c.arc(6,hy-1,4.5,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(-5,hy-1,2,0,7);c.arc(7,hy-1,2,0,7);c.fill();
    if(id==='kurba'){c.fillStyle='#58E07B';c.beginPath();c.arc(-8,hy-12,6,0,7);c.arc(8,hy-12,6,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(-8,hy-12,3.5,0,7);c.arc(8,hy-12,3.5,0,7);c.fill()}}
  c.restore();
}
function drawCarIcon(c,col,cx,cy,w,h){
  c.save();c.translate(cx,cy);c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.roundRect?c.roundRect(-w/2+2,-h/2+4,w,h,9):c.rect(-w/2,-h/2,w,h);c.fill();
  c.fillStyle=col;c.beginPath();c.roundRect?c.roundRect(-w/2,-h/2,w,h,9):c.rect(-w/2,-h/2,w,h);c.fill();
  c.fillStyle='rgba(255,255,255,.25)';c.fillRect(-w/2+4,-h/2+3,w/2-4,h-6);
  c.fillStyle='#10131a';c.fillRect(-w/2+4,-h/2+h*.2,w-8,h*.18);c.fillRect(-w/2+5,-h/2+h*.7,w-10,h*.1);
  c.fillStyle='#FFF3B0';c.fillRect(-w/2+3,-h/2+1,6,3);c.fillRect(w/2-9,-h/2+1,6,3);c.restore();
}

GAMES.push({id:'g2048',name:'2048',desc:'Sayıları kaydır, birleştir, 2048\'e ulaş',mount(root,api){
  let tiles=[],score=0,nid=1,won=false,busy=false,dead=false;
  const wrap=E('div','b2048');
  wrap.innerHTML='<div class="b-board"><div class="b-cells">'+'<i></i>'.repeat(16)+'</div><div class="b-tiles"></div></div><p class="hint">Parmağını kaydır ya da ok tuşlarını kullan</p>';
  root.appendChild(wrap);
  const board=$('.b-board',wrap),layer=$('.b-tiles',wrap);
  function paint(t,fresh){
    if(!t.el){const e=E('div','tile'+(fresh?' new':''),'<b></b>');t.el=e;layer.appendChild(e)}
    const e=t.el;e.style.left=t.c*25+'%';e.style.top=t.r*25+'%';
    const b=e.firstChild;b.textContent=t.v;b.dataset.l=String(t.v).length;
    e.className=e.className.replace(/\bv\d+\b/g,'').trim()+' v'+Math.min(Math.log2(t.v),11);
  }
  function snapshot(){api.save({tiles:tiles.map(t=>({v:t.v,r:t.r,c:t.c})),score,won})}
  function spawn(){
    const used=new Set(tiles.map(t=>t.r*4+t.c)),free=[];
    for(let i=0;i<16;i++)if(!used.has(i))free.push(i);
    if(!free.length)return;
    const p=free[rnd(free.length)],t={id:nid++,v:Math.random()<.9?2:4,r:p>>2,c:p&3};
    tiles.push(t);paint(t,true);
  }
  function canMove(){
    if(tiles.length<16)return true;
    const g={};tiles.forEach(t=>g[t.r*4+t.c]=t.v);
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){const v=g[r*4+c];if((c<3&&g[r*4+c+1]===v)||(r<3&&g[(r+1)*4+c]===v))return true}
    return false;
  }
  function pos(i,m,d){ // d: 0 sol,1 yukarı,2 sağ,3 aşağı
    return d===0?[i,m]:d===2?[i,3-m]:d===1?[m,i]:[3-m,i];
  }
  function move(d){
    if(busy||dead)return;
    const grid=Array.from({length:4},()=>Array(4).fill(null));
    tiles.forEach(t=>grid[t.r][t.c]=t);
    let moved=false,gained=0,maxMerge=0;const gone=[],keep=[];
    for(let i=0;i<4;i++){
      const line=[];
      for(let m=0;m<4;m++){const [r,c]=pos(i,m,d);if(grid[r][c])line.push(grid[r][c])}
      const out=[];
      for(const t of line){
        const prev=out[out.length-1];
        if(prev&&!prev.m&&prev.t.v===t.v){prev.t.v*=2;prev.m=true;t.to=out.length-1;gone.push(t);keep.push(prev.t);gained+=prev.t.v;maxMerge=Math.max(maxMerge,prev.t.v)}
        else{out.push({t,m:false});t.to=out.length-1}
      }
      line.forEach(t=>{const [r,c]=pos(i,t.to,d);if(t.r!==r||t.c!==c)moved=true;t.r=r;t.c=c});
    }
    if(!moved){shake(board);sfx('wrong');return}
    busy=true;sfx('move');
    tiles.forEach(t=>{const e=t.el;e.style.left=t.c*25+'%';e.style.top=t.r*25+'%'});
    setTimeout(()=>{
      gone.forEach(t=>{t.el.remove()});
      tiles=tiles.filter(t=>!gone.includes(t));
      keep.forEach(t=>{paint(t);t.el.classList.remove('new');t.el.classList.remove('pop');void t.el.offsetWidth;t.el.classList.add('pop')});
      if(keep.length){
        const k=Math.log2(maxMerge);sfx('merge',k);vib(10);
        const p=at(keep[0].el);
        if(maxMerge>=64){confetti(p.x,p.y,maxMerge>=512?70:25);floatText(p.x,p.y,'+'+gained);shake(board)}
        if(keep.length>1)sfx('combo',keep.length);
      }
      score+=gained;api.setScore(score,!gained);if(api.setBest(score)){}
      if(!won&&maxMerge>=2048){won=true;sfx('win');confetti(innerWidth/2,innerHeight/3,140,1.4);toast('2048! Harikasın ◆');addXP(60)}
      spawn();busy=false;
      if(!canMove()){dead=true;api.clear();sfx('lose');vib([40,60,40]);const nb=api.setBest(score);addXP(score/30);
        setTimeout(()=>api.over({title:'Hamle kalmadı',text:'Tahta doldu.',score,best:api.best(),newBest:nb&&score>0,onAgain:start}),450)}
      else snapshot();
    },125);
  }
  let sx=0,sy=0,tr=false;
  board.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;tr=true});
  board.addEventListener('pointerup',e=>{
    if(!tr)return;tr=false;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
    move(Math.abs(dx)>Math.abs(dy)?(dx<0?0:2):(dy<0?1:3));
  });
  const key=e=>{const m={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,a:0,w:1,d:2,s:3};if(e.key in m){e.preventDefault();move(m[e.key])}};
  addEventListener('keydown',key);
  function start(fromSave){
    layer.innerHTML='';tiles=[];score=0;won=false;dead=false;busy=false;nid=1;
    const sv=fromSave&&api.load();
    if(sv&&sv.tiles&&sv.tiles.length){sv.tiles.forEach(t=>{const n={id:nid++,v:t.v,r:t.r,c:t.c};tiles.push(n);paint(n)});score=sv.score||0;won=!!sv.won;toast('Kaldığın yerden devam')}
    else{api.clear();spawn();spawn()}
    api.setScore(score,true);snapshot();
  }
  start(true);
  return{destroy(){removeEventListener('keydown',key)},restart(){start(false)}};
}});

  const dims=p=>{const rows=PIECES[p.s];return[rows.length,rows[0].length]};

    const [h,w]=dims(p),d=E('div','pc');d.style.gridTemplateColumns=`repeat(${w},${px}px)`;d.style.gridAutoRows=px+'px';

      sfx('key');
    }
  }
  function start(fromSave){
    dead=false;busy=false;
    const sv=fromSave&&api.load();
    if(sv&&sv.grid){grid=sv.grid;pieces=sv.pieces;score=sv.score;combo=sv.combo||0;toast('Kaldığın yerden devam')}

  start(true);
  return{destroy(){removeEventListener('resize',rz)},restart(){start(false)}};
}});

  const CAP=4,TW=46,TH=166,FILL=.88,UNIT=TW*TH*FILL/4,D2R=Math.PI/180;

  const rectPoly=th=>{const hw=TW/2,hh=TH/2,c=Math.cos(th),s=Math.sin(th);return[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([x,y])=>[x*c-y*s,x*s+y*c])};

/* ================= ARKAPLAN MÜZİĞİ (üretken, telifsiz — tamamen kodla sentezlenir) ================= */
let MUS=null,MDUCK=1;const MV=()=>DB.mv==null?.45:DB.mv;
function musicLevel(f){MDUCK=f;if(MUS){const g=MUS.bus.gain,a=MUS.a;g.cancelScheduledValues(a.currentTime);g.setValueAtTime(g.value,a.currentTime);g.linearRampToValueAtTime(.3*MV()*f,a.currentTime+.6)}}
const CHORDS=[[-24,-12,-9,-5,2],[-28,-16,-12,-9,-5],[-21,-14,-10,-5,-2],[-26,-14,-10,-7,-5]],BELLS=[0,3,5,7,10,12];
function musicOn(){
  if(DB.music===false||MV()<=0||MUS)return;const a=audio();if(!a)return;
  const bus=a.createGain();bus.gain.value=0;bus.connect(a.destination);
  const dl=a.createDelay(1);dl.delayTime.value=.46;const fb=a.createGain();fb.gain.value=.28;
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;
  dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(bus);
  bus.gain.linearRampToValueAtTime(.3*MV()*MDUCK,a.currentTime+5);
  let ci=0,tc=a.currentTime+.2,tb=a.currentTime+3;
  function pad(s,t){
    for(const dt of[-7,7]){
      const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();
      o.type='triangle';o.frequency.value=N(s);o.detune.value=dt;f.type='lowpass';f.frequency.value=800;
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.034,t+3);g.gain.setValueAtTime(.034,t+5.2);g.gain.linearRampToValueAtTime(.0001,t+8.6);
      o.connect(f);f.connect(g);g.connect(bus);g.connect(dl);o.start(t);o.stop(t+9);
    }
  }
  function bell(s,t){
    const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();
    o.type='sine';o2.type='sine';o.frequency.value=N(s);o2.frequency.value=N(s)*2.01;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.022,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+3.6);
    o.connect(g);o2.connect(g);g.connect(bus);g.connect(dl);o.start(t);o2.start(t);o.stop(t+3.3);o2.stop(t+3.3);
  }
  const iv=setInterval(()=>{
    const now=a.currentTime;
    while(tc<now+1.2){CHORDS[ci%4].forEach(s=>pad(s,tc));ci++;tc+=8}
    while(tb<now+1.2){bell(BELLS[Math.floor(Math.random()*BELLS.length)],tb);tb+=4+Math.random()*5}
  },300);
  MUS={a,bus,iv};
}
function musicOff(){
  if(!MUS)return;const m=MUS;MUS=null;clearInterval(m.iv);
  try{m.bus.gain.cancelScheduledValues(m.a.currentTime);m.bus.gain.setValueAtTime(m.bus.gain.value,m.a.currentTime);m.bus.gain.linearRampToValueAtTime(0,m.a.currentTime+.8)}catch(e){}
  setTimeout(()=>{try{m.bus.disconnect()}catch(e){}},1500);
}
function applyMusic(){musicOff();DB.music=MV()>0;if(DB.music)setTimeout(musicOn,900)}
if(DB.music===undefined)DB.music=true;
document.addEventListener('pointerdown',()=>{if(!MUS)applyMusic()},{once:true});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(DB.music!==false||DB.sound)AC.resume()});

    for(let i=0;i<64;i++){const p=st.b[i];if(!p)continue;const cx=(i&7)*SQ+SQ/2,cy=(i>>3)*SQ+SQ/2+2,w=p>0;
      x.lineWidth=2.5;x.strokeStyle=w?'#2b2b33':'#e9e4d6';x.strokeText(GL[Math.abs(p)],cx,cy);x.fillStyle=w?'#fbf7ea':'#16181f';x.fillText(GL[Math.abs(p)],cx,cy)}
    if(sel>=0&&legal2){for(const m of legal2){const cx=(m.t&7)*SQ+SQ/2,cy=(m.t>>3)*SQ+SQ/2;x.fillStyle=st.b[m.t]||m.e?BAD:GOOD;x.globalAlpha=.7;x.beginPath();x.arc(cx,cy,st.b[m.t]||m.e?SQ*.42:SQ*.14,0,7);if(st.b[m.t]||m.e){x.lineWidth=3;x.strokeStyle=BAD;x.stroke()}else x.fill();x.globalAlpha=1}}
    raf=requestAnimationFrame(frame);
  }
  cvs.addEventListener('pointerdown',e=>{
    if(over||think||st.t!==1)return;const r=cvs.getBoundingClientRect(),c=Math.floor((e.clientX-r.left)/r.width*8),rr=Math.floor((e.clientY-r.top)/r.height*8),i=rr*8+c;
    if(sel>=0&&legal2){const mv=legal2.filter(m=>m.t===i);if(mv.length){play(mv[0]);return}}
    if(st.b[i]>0){sel=i;legal2=legal(st).filter(m=>m.f===i);sfx('tap')}else{sel=-1;legal2=null}
  });
  pm.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;diff=+b.dataset.d;sfx('click');newGame()});
  bar.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;sfx('click');
    if(b.dataset.a==='new')newGame();
    else if(!think&&!over){let h=null;while(hist.length){h=hist.pop();if(h.st.t===1)break}if(h&&h.st.t===1){st=h.st;last=h.last;sel=-1;legal2=null;status()}}});
  score=(api.load()||{}).score||0;api.setScore(score,true);
  newGame();raf=requestAnimationFrame(frame);
  return{destroy(){cancelAnimationFrame(raf)},restart(){newGame()}};
}});

renderHome();
</script>
